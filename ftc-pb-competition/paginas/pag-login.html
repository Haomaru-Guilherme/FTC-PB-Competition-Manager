<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC|PB Regional</title>
    <link rel="stylesheet" href="../estilos/style.css">
    <script src="../scripts/script.js" defer></script>
    
</head>
<body>
    <section class="login-screen">
        <div class="login-card">
            <div class="organization">
                <div class="box-ftc">
                    FTC
                </div> 
                <div class="column-itens">
                    <strong>COMPETITION</strong>
                    <span>REGIONAL · PARAÍBA</span>
                </div>
            </div>
            <div class="intro">
                <p class="minor">Login</p>
                <h1>Acesse o painel</h1>
                <p class="minor-information">Entre com suas credenciais para acompanhar os resultados da competição</p>
            </div>
            <form id="login-form">
                <div class="field">
                    <label for="username">Usuário</label>
                    <input type="text" placeholder="Digite seu usuário" id="username" required>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input type="password" placeholder="Digite sua senha" id="password" required>
                </div>
                <div>
                    <button type="submit">Entrar <span>→</span></button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
