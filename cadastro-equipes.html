<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTC-PB | Cadastro de Equipes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f172a; color: white; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #f97316; font-size: 28px; }
    header p { color: #94a3b8; margin-top: 5px; }
    .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 700px) { .container { grid-template-columns: 1fr; } }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; }
    .card h2 { margin-bottom: 15px; font-size: 18px; }
    label { display: block; margin: 12px 0 5px; font-size: 14px; color: #cbd5e1; }
    input, select { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0f172a; color: white; outline: none; border: 1px solid #334155; }
    input:focus { border-color: #f97316; }
    button { width: 100%; margin-top: 18px; padding: 13px; border: none; border-radius: 8px; background: #f97316; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
    button:hover { background: #ea580c; }
    .equipe { background: #0f172a; padding: 14px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #f97316; display: flex; justify-content: space-between; align-items: center; }
    .equipe b { display: block; }
    .equipe span { color: #94a3b8; font-size: 13px; }
    .numero { background: #f97316; padding: 6px 10px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .vazio { color: #64748b; text-align: center; padding: 20px; }
    .remover { background: #ef4444; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 0; width: auto; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 FTC-PB Competition Manager</h1>
    <p>Cadastro de Equipes - Paraíba</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Cadastrar Nova Equipe</h2>
      <label>Número da Equipe</label>
      <input type="number" id="numero" placeholder="Ex: 12345">
      <label>Nome da Equipe</label>
      <input type="text" id="nome" placeholder="Ex: Criadores">
      <label>Escola / Instituição</label>
      <input type="text" id="escola" placeholder="Ex: SESI João Pessoa">
      <label>Categoria</label>
      <select id="categoria">
        <option value="FTC">FTC - FIRST Tech Challenge</option>
        <option value="FLL">FLL - FIRST LEGO League</option>
      </select>
      <button onclick="cadastrar()">Cadastrar Equipe</button>
    </div>

    <div class="card">
      <h2>Equipes Cadastradas (<span id="total">0</span>)</h2>
      <div id="lista"></div>
    </div>
  </div>

  <script>
    let equipes = JSON.parse(localStorage.getItem('ftc-pb-equipes') || '[]');
    function render() {
      const lista = document.getElementById('lista');
      document.getElementById('total').innerText = equipes.length;
      if (equipes.length === 0) {
        lista.innerHTML = '<p class="vazio">Nenhuma equipe cadastrada ainda.<br>Cadastre a primeira!</p>';
        return;
      }
      lista.innerHTML = equipes.map((e, i) => `
        <div class="equipe">
          <div><b>${e.nome}</b><span>${e.escola} • ${e.categoria}</span></div>
          <div style="display:flex; gap:8px; align-items:center;">
            <span class="numero">#${e.numero}</span>
            <button class="remover" onclick="remover(${i})">X</button>
          </div>
        </div>
      `).join('');
    }
    function cadastrar() {
      const numero = document.getElementById('numero').value;
      const nome = document.getElementById('nome').value.trim();
      const escola = document.getElementById('escola').value.trim();
      const categoria = document.getElementById('categoria').value;
      if (!numero || !nome || !escola) { alert('Preenche todos os campos!'); return; }
      if (equipes.some(e => e.numero === numero)) { alert('Já tem uma equipe com esse número!'); return; }
      equipes.push({ numero, nome, escola, categoria });
      localStorage.setItem('ftc-pb-equipes', JSON.stringify(equipes));
      document.getElementById('numero').value = '';
      document.getElementById('nome').value = '';
      document.getElementById('escola').value = '';
      render();
    }
    function remover(i) { equipes.splice(i, 1); localStorage.setItem('ftc-pb-equipes', JSON.stringify(equipes)); render(); }
    render();
  </script>
</body>
</html>
